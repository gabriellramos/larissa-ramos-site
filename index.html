<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <title>Dra. Larissa Ramos - Fisioterapia Especializada</title>
    <!-- Elfsight Google Reviews (Deferred to improve performance) -->
    <script>
      (function() {
        var loaded = false;
        function loadElfsight() {
          if (loaded) return;
          loaded = true;
          var script = document.createElement('script');
          script.src = 'https://elfsightcdn.com/platform.js';
          script.async = true;
          document.head.appendChild(script);
        }
        window.addEventListener('scroll', loadElfsight, { passive: true, once: true });
        window.addEventListener('mousemove', loadElfsight, { passive: true, once: true });
        window.addEventListener('touchstart', loadElfsight, { passive: true, once: true });
        setTimeout(loadElfsight, 3000); // Fallback load after 3s
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
